# Sift eats its own dog food: this repo gates its own agent configuration.
name: context-budget
on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "AGENTS.md"
      - ".claude/**"
      - ".mcp.json"
      - "sift.budget.json"
permissions:
  contents: read
  pull-requests: write
jobs:
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Sift gates its own agent configuration with its own action.
      - uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha }}
